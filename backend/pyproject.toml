[project]
name = "friend-cost-backend"
version = "0.1.0"
description = "친구비 측정기 백엔드"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]
# 컨테이너 내장 OCR. API 키가 필요 없는 대신 상시 실행 인스턴스를 전제한다.
#
# 3.0 미만을 쓰면 안 된다. 구버전(`rapidocr-onnxruntime`)의 한국어 모델은
# 2021년 것뿐이라 문자 오류율이 54%였다. 3.x 는 PP-OCRv4 한국어 모델을
# 받아 쓰며 같은 캡처에서 31.7%가 나왔다.
ocr = [
    "rapidocr>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
